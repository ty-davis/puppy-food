name: puppy-food

services:
  puppy-food:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      DATABASE_PATH: /data/puppy-food.db
      WEB_DIST: /app/frontend/dist
    volumes:
      - puppy-food-data:/data

volumes:
  puppy-food-data:
    name: puppy-food-data
